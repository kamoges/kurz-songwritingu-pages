<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurz songwritingu - písanie textov pre zhudobnenie</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root{
    --paper:#f6f1e7;
    --paper-2:#efe8d8;
    --ink:#241f1a;
    --ink-soft:#5a5147;
    --line:#d8cdb6;
    --accent:#9c2b63;      /* hlboká magenta (z grafík leilaspoems) */
    --accent-2:#45418f;    /* indigo */
    --gold:#b06a24;        /* teplá oranžovo-zlatá */
    --card:#fffdf8;
    --shadow:rgba(60,45,25,.12);
    --ok:#2f7d4f;
    --bad:#b23a2e;
    --radius:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  /* jemná linajková textúra na pozadí */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(120,100,70,.05) 32px);
  }

  /* ---------- LAYOUT ---------- */
  .wrap{display:flex;min-height:100vh}
  .sidebar{
    width:300px;flex-shrink:0;background:var(--paper-2);
    border-right:1px solid var(--line);
    padding:28px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .content{flex:1;max-width:820px;margin:0 auto;padding:48px 40px 120px}

  /* ---------- SIDEBAR ---------- */
  .brand{font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;
    text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .brand-title{font-size:22px;line-height:1.25;margin-bottom:22px;font-weight:normal}
  .brand-title b{font-weight:bold}
  .progress-box{background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:22px;font-size:13px}
  .progress-bar{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent) 55%,var(--gold));width:0;transition:width .4s ease}
  .nav-item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:var(--radius);
    cursor:pointer;font-size:14px;color:var(--ink-soft);transition:background .15s,color .15s;margin-bottom:2px}
  .nav-item:hover{background:rgba(156,43,99,.07);color:var(--ink)}
  .nav-item.active{background:var(--accent);color:#fff}
  .nav-item.active .nav-num{color:#fff;border-color:rgba(255,255,255,.5)}
  .nav-num{font-family:'Courier New',monospace;font-size:11px;width:22px;height:22px;flex-shrink:0;
    border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--accent);margin-top:1px}
  .nav-check{margin-left:auto;color:var(--ok);font-size:14px;flex-shrink:0}
  .nav-group-label{font-family:'Courier New',monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--gold);margin:18px 0 8px 10px}

  /* ---------- CONTENT ---------- */
  .module{display:none;animation:fade .4s ease}
  .module.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .eyebrow{font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;
    text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  h1{font-size:38px;line-height:1.15;font-weight:normal;margin-bottom:8px;letter-spacing:-.5px}
  h1 .big{display:block;font-size:15px;font-family:'Courier New',monospace;color:var(--gold);
    letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
  .lede{font-size:19px;color:var(--ink-soft);font-style:italic;margin-bottom:32px;line-height:1.6}
  h2{font-size:25px;font-weight:normal;margin:38px 0 14px;padding-bottom:8px;
    border-bottom:2px solid var(--line);letter-spacing:-.3px}
  h3{font-size:19px;font-weight:bold;margin:26px 0 10px;color:var(--accent-2)}
  p{margin-bottom:14px}
  .content ul,.content ol{margin:0 0 16px 22px}
  .content li{margin-bottom:7px}
  strong{color:var(--ink)}
  em{color:var(--ink-soft)}

  .callout{background:var(--card);border-left:4px solid var(--accent);
    border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin:22px 0;box-shadow:0 2px 8px var(--shadow)}
  .callout.tip{border-left-color:var(--accent-2)}
  .callout.warn{border-left-color:var(--gold)}
  .callout-label{font-family:'Courier New',monospace;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:bold}
  .callout.tip .callout-label{color:var(--accent-2)}
  .callout.warn .callout-label{color:var(--gold)}

  .lyric{background:var(--paper-2);border:1px dashed var(--line);border-radius:var(--radius);
    padding:16px 22px;margin:18px 0;font-style:italic;color:var(--ink);white-space:pre-line;line-height:1.9}

  table{width:100%;border-collapse:collapse;margin:20px 0;font-size:15px;background:var(--card);
    border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px var(--shadow)}
  th{background:var(--accent-2);color:#fff;text-align:left;padding:11px 14px;font-weight:bold;font-size:14px}
  td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
  tr:nth-child(even) td{background:var(--paper)}

  .example-artist{display:inline-block;background:var(--paper-2);border:1px solid var(--line);
    border-radius:20px;padding:2px 12px;font-size:13px;font-family:'Courier New',monospace;
    color:var(--accent-2);margin:2px 4px 2px 0}
  a.example-artist{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;
    transition:border-color .15s,color .15s,background .15s}
  a.example-artist::after{content:" ▶";font-size:9px;color:var(--gold)}
  a.example-artist.suno{color:var(--accent);border-color:var(--accent)}
  a.example-artist.suno::after{content:" ♪";font-size:11px;color:var(--accent)}
  a.example-artist:hover{border-color:var(--accent);color:var(--accent);background:#fff}

  /* ---------- QUIZ ---------- */
  .quiz{background:var(--card);border:2px solid var(--accent);border-radius:8px;
    padding:26px 28px;margin:40px 0 20px;box-shadow:0 4px 16px var(--shadow)}
  .quiz-head{font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px;
    text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .quiz h3{color:var(--ink);margin-top:4px}
  .q{margin:22px 0;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .q:last-of-type{border-bottom:none}
  .q-text{font-weight:bold;margin-bottom:12px;font-size:16px}
  .q-opt{display:block;padding:11px 16px;margin:7px 0;background:var(--paper);
    border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:all .15s;font-size:15px}
  .q-opt:hover{border-color:var(--accent);background:#fff}
  .q-opt.selected{border-color:var(--accent);background:rgba(156,43,99,.08)}
  .q-opt.correct{border-color:var(--ok);background:rgba(47,125,79,.12);color:#1c5233}
  .q-opt.wrong{border-color:var(--bad);background:rgba(178,58,46,.1);color:#8a2b22}
  .q-opt.disabled{cursor:default;pointer-events:none}
  .btn{font-family:'Courier New',monospace;font-size:14px;letter-spacing:1px;text-transform:uppercase;
    background:var(--accent);color:#fff;border:none;padding:13px 28px;border-radius:var(--radius);
    cursor:pointer;transition:background .15s;margin-top:8px}
  .btn:hover{background:#7c2250}
  .btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.secondary:hover{background:rgba(156,43,99,.08)}
  .quiz-result{margin-top:20px;padding:18px;border-radius:var(--radius);font-size:16px;display:none}
  .quiz-result.show{display:block}
  .quiz-result.pass{background:rgba(47,125,79,.12);border:1px solid var(--ok);color:#1c5233}
  .quiz-result.fail{background:rgba(178,58,46,.1);border:1px solid var(--bad);color:#8a2b22}

  .module-footer{display:flex;justify-content:space-between;margin-top:50px;gap:12px}

  /* ---------- WELCOME / HERO ---------- */
  .hero{
    text-align:center;padding:64px 34px 56px;margin:0 0 10px;border-radius:10px;
    background:
      linear-gradient(180deg,rgba(26,16,50,.78),rgba(44,20,66,.60) 55%,rgba(26,16,50,.82)),
      url("assets/hero.webp") center/cover no-repeat,
      linear-gradient(135deg,#2c2358,#7c2a6e 45%,#d4622a 90%);
    color:#f4ecdf;box-shadow:0 12px 32px rgba(40,20,60,.35);
  }
  .hero .kicker{font-family:'Courier New',monospace;letter-spacing:3px;text-transform:uppercase;
    color:#f0b25c;font-size:13px;margin-bottom:16px}
  .hero h1{font-size:52px;margin-bottom:16px;color:#fff;text-shadow:0 2px 18px rgba(20,10,40,.55)}
  .hero h1 em{color:#ffd9a0;font-style:italic}
  .hero .sub{font-size:20px;color:#eadff2;font-style:italic;max-width:620px;margin:0 auto 10px;
    text-shadow:0 1px 10px rgba(20,10,40,.5)}

  .intro-quote{background:var(--card);border-left:4px solid var(--gold);
    border-radius:0 var(--radius) var(--radius) 0;padding:22px 26px;margin:28px 0;
    font-style:italic;font-size:17px;line-height:1.75;box-shadow:0 2px 8px var(--shadow)}
  .intro-quote p{margin-bottom:12px}
  .intro-quote p:last-child{margin-bottom:0}

  .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:36px 0}
  .feature{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent-2);
    border-radius:var(--radius);padding:20px;text-align:left;box-shadow:0 2px 8px var(--shadow)}
  .feature .fnum{font-family:'Courier New',monospace;color:var(--gold);font-size:13px;margin-bottom:6px}
  .feature h4{font-size:17px;margin-bottom:6px}
  .feature p{font-size:14px;color:var(--ink-soft);margin:0}

  .reset-link{font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;
    display:inline-block;margin-top:14px;font-family:'Courier New',monospace}

  /* ---------- MOBILE ---------- */
  .menu-toggle{display:none}
  @media(max-width:860px){
    .wrap{flex-direction:column}
    .sidebar{width:100%;height:auto;position:relative;top:0;
      border-right:none;border-bottom:1px solid var(--line);display:none}
    .sidebar.open{display:block}
    .content{padding:28px 20px 100px;max-width:100%}
    .menu-toggle{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;
      background:var(--accent);color:#fff;border:none;width:100%;padding:14px 20px;
      font-family:'Courier New',monospace;letter-spacing:1px;text-transform:uppercase;
      font-size:13px;cursor:pointer}
    h1{font-size:30px}.hero h1{font-size:36px}.lede{font-size:17px}
    h2{font-size:22px}
    .hero{padding:44px 22px 40px}
  }
</style>
</head>
<body>
<button class="menu-toggle" onclick="toggleMenu()">☰ &nbsp;Obsah kurzu</button>
<div class="wrap">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Kurz songwritingu</div>
    <div class="brand-title">Ako písať texty,<br>ktoré <b>zaznejú</b></div>
    <div class="progress-box">
      <div>Tvoj postup: <b id="prog-label">0 / 18 modulov</b></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
    <nav id="nav"></nav>
    <span class="reset-link" onclick="resetProgress()">↺ vynulovať postup</span>
  </aside>

  <main class="content" id="content"></main>
</div>

<script>
/* ================= UI REŤAZCE + KONFIG JAZYKA (SK) =================
   Pre ďalšiu jazykovú mutáciu (CZ) vznikne src/cz/ui.js s rovnakou
   štruktúrou — app.js v core/ je jazykovo neutrálny a číta len UI/STORE_KEY. */

const STORE_KEY = "kurz_songwritingu_v1";

const UI = {
  progress: (d, t) => `${d} / ${t} modulov`,
  quizHead: "Test modulu",
  quizTitle: "Over si svoje znalosti",
  quizNeed: (p, t) => `Na dokončenie modulu potrebuješ aspoň ${p} z ${t} správnych odpovedí.`,
  quizSubmit: "Vyhodnotiť test",
  quizRetry: "Skúsiť znova",
  quizAnswerAll: "Odpovedz najprv na všetky otázky.",
  quizPass: (c, t, hasNext) => `<b>Výborne! ${c}/${t} správne.</b> Modul je dokončený. ${hasNext ? "Môžeš pokračovať ďalej." : ""}`,
  quizFail: (c, t, p) => `<b>${c}/${t} správne.</b> Potrebuješ aspoň ${p}. Prezri si modul znova a skús to ešte raz - tlačidlo „Skúsiť znova“.`,
  quizPassShort: (c, t) => `<b>Výborne! ${c}/${t} správne.</b> Modul je dokončený.`,
  quizFailShort: (c, t, p) => `<b>${c}/${t} správne.</b> Potrebuješ aspoň ${p}. Skús to znova.`,
  btnPrev: "← Späť",
  btnNext: "Ďalší modul →",
  projectDone: "Projekt dokončený ✓",
  resetConfirm: "Naozaj vynulovať celý postup? Táto akcia sa nedá vrátiť.",
  artistLinkTitle: "Ukážka na YouTube (otvorí sa v novom okne)",
  sunoLinkTitle: "Vypočuj si skladbu Leily K na Suno (otvorí sa v novom okne)"
};

/* Overené YouTube odkazy interpretov (schválené používateľom, 2026-07).
   Kľúč = začiatok textu štítku .example-artist; app.js štítky automaticky
   zmení na odkazy. Štítky bez záznamu (napr. Leila K, básnici) ostávajú
   nekliknuteľné. Offline použitie kurzu to neovplyvní. */
const ARTIST_LINKS = {
  "Jana Kirschner": "https://www.youtube.com/watch?v=SAuLBciZ4qI",
  "Pokáč": "https://www.youtube.com/watch?v=k0ovrq2fNOY",
  "Miro Žbirka": "https://www.youtube.com/watch?v=zTD51KfsFEY",
  "Elán": "https://www.youtube.com/watch?v=ryl1XEwg3c8",
  "Horkýže Slíže": "https://www.youtube.com/watch?v=89YFb7qQyy8",
  "Kontrafakt": "https://www.youtube.com/watch?v=SRmeDpgJvsw",
  "Richard Müller": "https://www.youtube.com/watch?v=XgI5TJDtmS8",
  "Michal Hrůza": "https://www.youtube.com/watch?v=tAYVEm4ZoDg",
  "Peter Bič Project": "https://www.youtube.com/watch?v=k5gfgE-jirY",
  "Iné Kafe": "https://www.youtube.com/watch?v=3-VIvaNBDKI",
  "Para": "https://www.youtube.com/watch?v=wCI6rEWQXIA",
  "Hex": "https://www.youtube.com/watch?v=dWEWTl1Ko78",
  "Zuzana Smatanová": "https://www.youtube.com/watch?v=X3BYYdJIKHM",
  "Peha": "https://www.youtube.com/watch?v=fI0iRdZnaXk",
  "Celeste Buckingham": "https://www.youtube.com/watch?v=V8CQjV8vXJE",
  "Longital": "https://www.youtube.com/watch?v=qDFLzs-CIc0",
  "Rytmus": "https://www.youtube.com/watch?v=s6aBseA09LE",
  "Separ": "https://www.youtube.com/watch?v=ji3WXp6Yx9c",
  "Vec": "https://www.youtube.com/watch?v=ME_w5ZkFm2U",
  "Zuzana Homolová": "https://www.youtube.com/watch?v=Dsh_y1vA300",
  "Ursiny": "https://www.youtube.com/watch?v=GKTL3ugJbJY",
  "Filip": "https://www.youtube.com/watch?v=1V3Q7UXZV0I"
};

/* Suno odkazy na skladby Leily K (dodal používateľ, 2026-07-14).
   Kľúč = názov skladby; štítok sa zlinkuje, ak je text štítku presne názov
   skladby, alebo končí na „— <názov>“ (formát „Leila K — <názov>“).
   „Nádych a výdych“ zatiaľ nemá v kurze štítok — odkaz je pripravený. */
const LEILA_LINKS = {
  "Tulák": "https://suno.com/s/BnWfJYHltx0j1RBu",
  "Len jeden deň": "https://suno.com/s/0CT4rVZ1AKNyhuOu",
  "Dieťa sídliska": "https://suno.com/s/KOKYUf45BkQGBDPS",
  "Zrkadlá": "https://suno.com/s/XTJ6oQJZfvz399Zu",
  "Druhý pokus": "https://suno.com/s/DSLfYy7eu2eoy68Q",
  "Nádych a výdych": "https://suno.com/s/kxDDmM2eLSOsrBHl",
  "Ahoj, ja som Leila": "https://suno.com/s/zCycpASYAasohlGo",
  "Dievča": "https://suno.com/s/kjzOL6EdgYqRTkAM",
  "Zapletený do teba": "https://suno.com/s/ewODgiqItkPCYXUE",
  "Štyri hlavy": "https://suno.com/s/NXjtmRr1dqOyHRWK",
  "Je čas": "https://suno.com/s/HO4LmbKaPMDgYW1Q",
  "Vzal to čas": "https://suno.com/s/qsLbehYacHdiJjrU",
  "Instantný život": "https://suno.com/s/BPvSCL1NWIXGEqux",
  "Blázon": "https://suno.com/s/IFaDqFo5uNNgOKoe",
  "Digitálny race": "https://suno.com/s/C3tMIStilGYRM7ba"
};

/* ================= OBSAH KURZU — ČASŤ 1 (moduly 0–3) ================= */

const MODULES_P1 = [
{
  id:"vitaj", group:"Úvod", num:"★", title:"Vitaj v kurze",
  welcome:true,
  html:`
    <div class="hero">
      <div class="kicker">Songwriting pre slovenčinu · optimalizované pre Suno AI</div>
      <h1>Ako písať texty,<br>ktoré <em>zaznejú</em></h1>
      <p class="sub">Nestačí mať len „správny“ text, ale mať text s rytmom, dychom a vnútornou pravdou a taký, ktorý sa dá zhudobniť bez toho, aby sa slová lámali cez melódiu.</p>
    </div>

    <div class="intro-quote">
      <p>Poézia žije na papieri. Môže byť pokojne tichá, ťažká, krivá. Číta sa očami, v ľubovoľnom čase, a dovolí ti zastať a popremýšľať, kde chceš.</p>
      <p>Próza plynie. Buduje obraz sveta vetu za vetou, má priestor sa rozbehnúť, vysvetľovať, odbáčať.</p>
      <p><strong>Text piesne nežije na papieri, ale žije v čase a v dychu.</strong> Musí sadnúť do melódie, dať sa zaspievať na jeden nádych, zniesť opakovanie a neomrzieť. Tu slovo nevládne samo: slúži zvuku, rytmu a hlasu, ktorý ho ponesie. Krásny verš, ktorý sa láme cez melódiu, je zlý, aj keby bol z dokonalej básne.</p>
      <p>Tento kurz je práve o tom prechode: ako premeniť to, čo cítiš, na slová, ktoré <em>zaznejú</em>.</p>
    </div>

    <div class="feature-grid">
      <div class="feature"><div class="fnum">01</div><h4>Od základov k praxi</h4><p>Štruktúra, rytmus, rýmy, spievateľnosť, to je presne to, čo rozhoduje, či sa text dá zhudobniť.</p></div>
      <div class="feature"><div class="fnum">02</div><h4>Slovenské a české príklady</h4><p>Učíme sa na tvorbe, ktorú poznáš: Kirschner, Müller, Pokáč, Horkýže, Kontrafakt a ďalší.</p></div>
      <div class="feature"><div class="fnum">03</div><h4>Test po každom module</h4><p>Overíš si, čo si pochopil. Postup sa ti ukladá priamo v prehliadači.</p></div>
      <div class="feature"><div class="fnum">04</div><h4>Cielené na Suno AI</h4><p>Nielen ako napísať text, ale ako ho pripraviť tak, aby ho hudobný model zhudobnil a zaspieval dobre.</p></div>
    </div>

    <h2>Pre koho je tento kurz</h2>
    <ul>
      <li>Pre autorov, ktorí už píšu básne, denníky, útržky a chcú, aby sa ich texty dali zhudobniť.</li>
      <li>Pre začínajúcich textárov, ktorí tvoria po slovensky a hudbu skladajú v Suno AI (alebo to plánujú).</li>
      <li>Pre každého, kto má čo povedať a chce to povedať tak, aby to obstálo v speve, nie iba na papieri.</li>
    </ul>

    <h2>Čo potrebuješ vopred</h2>
    <ul>
      <li><strong>Chuť písať a prepisovať</strong>, dobrý text vzniká revíziou, nie prvým nápadom.</li>
      <li><strong>Cit pre jazyk (slovenčinu)</strong> na bežnej úrovni. Žiadna teória verša ani hudobné vzdelanie sa nevyžaduje.</li>
      <li>Nič viac. Žiadny nástroj, notový zápis ani predchádzajúca skúsenosť.</li>
    </ul>

    <h2>Čo budeš vedieť po absolvovaní</h2>
    <ul>

    <h1>Anatómia piesne</h1>

    <h2>Základné stavebné bloky</h2>
    <p>Moderná pieseň — či už pop, rock, folk alebo rap — pracuje s obmedzeným počtom častí. Keď ich raz spoznáš, budeš ich vidieť v každej skladbe, ktorú počuješ.</p>

    <h3>Verš (sloha)</h3>

    <h3>Refrén (chorus)</h3>
    <p>Srdce piesne. Opakuje sa, obsahuje hlavnú myšlienku a musí byť <strong>zapamätateľný po prvom vypočutí</strong>. Kľúčové pravidlo: refrén hovorí to isté zakaždým — a práve preto ho ľudia spievajú. Je jednoduchší a údernejší než verš.</p>

    <p>Nepovinný „mostík napätia“ medzi veršom a refrénom. Zvyšuje energiu, akoby si stúpal po schodoch pred skokom. Veľa piesní ho vynecháva — je to legitímna voľba.</p>

    <h3>Bridge (mostík)</h3>
    <p>Prichádza zvyčajne raz, po druhom refréne. Prináša <strong>kontrast</strong> — inú melódiu, iný uhol pohľadu, zvrat. V texte to môže byť moment uvedomenia, otočenie príbehu alebo otázka bez odpovede. Bez bridgu pieseň často pôsobí repetitívne.</p>

    <h3>Intro a Outro</h3>
    <p>Intro naladí poslucháča a vtiahne ho dovnútra — môže byť inštrumentálne alebo textové. Outro uzatvára: môže stíchnuť, zopakovať prvý verš alebo nechať otázku visieť vo vzduchu.</p>

    <div class="eyebrow">Modul 1+ · Rozšírenie k anatómii</div>
    <h1>Intro a jeho štyri funkcie</h1>
    <p class="lede">Intro je prvý dojem, ktorý rozhoduje. V prvých sekundách naraz nastavuje štyri veci: náladu, hlas, očakávania a tému. Zvládni ich a poslucháč zostane.</p>

      <div class="callout-label">Štyri funkcie naraz</div>

    <p>Nálada v intre je súbor konkrétnych nástrojov, ktoré textár vedome volí. Hudba a text pracujú spolu, ale ty ako textár máš kontrolu nad tým, <strong>čo</strong> a <strong>ako</strong> povieš v prvých riadkoch. Tu je päť nástrojov, ktorými sa nálada tvorí.</p>

    <h2>Päť nástrojov nálady</h2>
    <table>
      <tr><th>Nástroj</th><th>Ako funguje</th></tr>

    <p>Nálada vzniká ich <strong>súhrou</strong> — nie jedným trikom, ale kombináciou. Poďme na štyri typické nálady a rozoberme, ako sa stavajú.</p>

    <p><span class="example-artist">Jana Kirschner</span> stavia intrá práve na konkrétnom obraze namiesto abstraktnej emócie.</p>

    <h2>Funkcia 4 — Náznak témy</h2>

{

    <div class="eyebrow">Modul 1a · Rozšírenie k anatómii</div>
    <h1>Verš (sloha) do hĺbky</h1>

    <h2>Hlavná úloha: posúvať, nie opakovať</h2>
    <p>Najčastejšia chyba začínajúcich textárov — každá sloha hovorí to isté inými slovami. Dobrý verš vždy <strong>niekam posunie</strong>: pridá detail, zmení uhol, prehĺbi situáciu. Predstav si slohy ako zábery filmu — každý ukazuje niečo nové.</p>

    <h1>Style prompty do hĺbky</h1>
    <p class="lede">Style prompt je globálny „mozog" piesne. Rozhoduje o žánri, hlase a produkcii. Tu sa naučíš napísať ho tak, aby výsledok nebol generický AI zvuk, ale konkrétny charakter.</p>

    <h2>Front-loading — prvých 20–30 slov</h2>
    <p>Model dáva <strong>najväčšiu váhu prvým 20–30 slovám</strong>. Žáner, subžáner a BPM preto musia byť vždy na začiatku. Čo napíšeš neskoro, model často „nedopočuje".</p>

    <p>Každý parameter na nový riadok, oddeľovač je čiarka, <strong>nikdy</strong> <code>|</code>, vždy po anglicky. Limit je <strong>1000 znakov</strong> vrátane Exclude bloku.</p>

Mood: [2–3 slová — vždy anglicky]
Tempo: [BPM podľa slovenského stropu]
Key: [tónina — voliteľné: D minor, E major…]
Instruments: [1 sólo nástroj + 3–6 ostatných]
Percussion: [typ rytmického vzoru]
Bass: [tón + pohyb]
Vocals: [female/male — povinné prvé slovo], [register], [timbre], [prednes]
Voice gender: [female / male]
Mix: [FX, priestor, textúra]
Energy: [krivka po sekciách]
Source_influence: [produkčná charakteristika — BEZ mien interpretov]
no [unwanted], no [unwanted]
Sung in Slovak language with very clear articulation,
natural Slovak stress and vowel length respected</div>

    <h2>Konkrétnosť porazí generickosť</h2>
    <p>Toto je jadro celého remesla. Vágny prompt → generický AI hlas. Konkrétny prompt → rozlíšiteľný charakter. Sedem pravidiel konkrétnosti:</p>
    <ul>
      <li><strong>Žáner + subžáner + epocha:</strong> „classic Chicago deep house 1990s" &gt; „house music"</li>
      <li><strong>BPM konkrétne:</strong> „122 BPM" &gt; „mid-tempo"</li>
      <li><strong>Tónina konkrétne:</strong> „E minor" &gt; „minor key"</li>
      <li><strong>Nástroj konkrétne:</strong> „Rhodes electric piano" &gt; „piano"; „Fender Telecaster through Vox amp" &gt; „guitar"</li>
      <li><strong>Produkčná epocha:</strong> „80s analog warmth" / „2010s trap production"</li>
      <li><strong>Jeden definičný zvuk:</strong> house = „four-on-the-floor kick"; UK drill = „sliding 808 bass"</li>
      <li><strong>Negatívny priestor:</strong> „no auto-tune — the voice is human and proud of it"</li>
    </ul>

    <div class="callout">
      <div class="callout-label">Generický vs. špecifický — príklad</div>
      <p style="margin:0 0 8px"><strong>Generický</strong> (výsledok: AI default voice): „pop song, female vocals, sad"</p>
      <p style="margin:0"><strong>Špecifický</strong> (rozlíšiteľný charakter): „dark indie pop, 70 BPM, low mezzo-soprano, breathy with vocal fry on low notes, intimate dry recording, slight room reverb, melancholic and inward, sparse piano and cello"</p>
    </div>

    <h2>Negatívne prompty — dva nástroje</h2>
    <p><strong>1. Inline <code>no</code></strong> (na konci tela promptu) — vylučuje konkrétne prvky: <code>no autotune, no reverb wash</code>. Táto dvojica je najsilnejšia kombinácia pre organický, „neumelý" zvuk.</p>

    <div class="callout warn">

    <h2>Voice cloning (v5.5 Pro/Premier)</h2>
    <table>

  html:`
    <div class="eyebrow">Modul 9b · Prax a Suno</div>
    <h1>Delivery a meta tagy v Lyrics poli</h1>
    <p class="lede">Meta tagy sú inštrukcie v hranatých zátvorkách priamo v texte. Hovoria modelu, ako má každá sekcia znieť — namiesto dúfania, že to uhádne.</p>

    <h2>Formátovacie symboly v texte</h2>
    <table>
      <tr><th>Symbol</th><th>Funkcia</th><th>Príklad</th></tr>
      <tr><td><code>~</code></td><td>Hold noty, vibrato</td><td><code>prí~de</code> <code>stá~le</code></td></tr>
      <tr><td><code>-</code></td><td>Naťahuj slabiky, hláskuj</td><td><code>po-ma-ly</code></td></tr>
      <tr><td><code>ALL CAPS</code></td><td>Hlasnejšie — max 1–3 slová</td><td><code>NIKDY viac</code></td></tr>
      <tr><td><code>" "</code></td><td>Spoken / whispered text</td><td><code>"si nikdy neprišiel"</code></td></tr>
      <tr><td><code>......</code></td><td>Sustain — viac bodiek = dlhší hold</td><td><code>ticho............</code></td></tr>
    </table>
    <div class="callout tip">
      <div class="callout-label">Slovenský trik s tildou</div>
      <p style="margin:0">Tilda <code>~</code> na dĺžňach — <code>prí~de</code>, <code>stá~le</code> — pomáha modelu správne vykresliť dlhé slovenské samohlásky. Veľmi užitočné proti komoleniu.</p>
    </div>

    <h2>Sekčné tagy (Suno v5.5)</h2>
    <p>Akceptované sekcie: <code>Intro · Verse · Pre-Chorus · Chorus · Post-Chorus · Bridge · Break · Breakdown · Build · Drop · Interlude · Outro · Hook · Refrain · Solo · Instrumental · Rap Verse · End · Fade Out · Final Chorus</code>.</p>
    <p>Záverečné tagy riešia loopovanie: <code>[End]</code> (presné miesto konca), <code>[Fade Out]</code> (postupné vyznenie), <code>[Final Chorus]</code> (klimaktický záver).</p>

    <h2>Emotion / delivery tagy</h2>
    <p>Umiestni ich na <strong>vlastný riadok pred</strong> emotívny verš. <strong>Nestackuj</strong> ich s <code>|</code>. Výber:</p>
    <table>
      <tr><th>Tag</th><th>Emócia</th></tr>
      <tr><td><code>[Tender]</code></td><td>Jemný, láskyplný</td></tr>

      <tr><td><code>[Defiant]</code></td><td>Vzdorovitý, silný</td></tr>

      <tr><td><code>[Crying voice]</code></td><td>Slzavý, prerývaný prednes</td></tr>
      <tr><td><code>[Intimate]</code></td><td>Osobný, blízky</td></tr>
    </table>

    <h2>Štýl prednesu (vokálne tagy)</h2>
    <p>Určujú techniku spevu: <code>[Whisper]</code> (intímny), <code>[Belted]</code> (silné držané noty), <code>[Falsetto]</code>, <code>[Spoken word]</code>, <code>[Rap]</code>, <code>[Melodic Rap]</code>, <code>[Raspy lead vocal]</code>, <code>[Crooning]</code> (plynný, intímny), <code>[Humming]</code>.</p>

    <h2>Performance cues — jemné textúry (v okrúhlych)</h2>
    <p>Detailné vokálne textúry sa dávajú do <code>( )</code> a <strong>spievajú sa ako súčasť prednesu</strong>. Sú to remeselné nuansy pre pokročilých:</p>
    <div class="lyric">(breathy falsetto)         — vzdušné falzeto
(catch in throat)          — zachytenie v hrdle (emočný zlom)
(trembling on sustained note) — chvenie na držanom tóne
(swelling from whisper to wail) — narastanie od šepotu po nárek
(gravelly low note)        — štrkovitý hlboký tón
(explosive belt moment)    — explozívny silný moment</div>

    <h2>Tag stacking (pipe |)</h2>
    <p>V Lyrics poli môžeš stackovať viac pokynov cez <code>|</code> — funguje ako „a zároveň". Veď <strong>názvom sekcie</strong>, max <strong>4 tagy</strong> na sekciu:</p>
    <div class="lyric">[Chorus | anthemic | stacked harmonies | modern pop polish]
[Verse | autotuned delivery | tuned male vocal | light reverb]</div>
    <div class="callout warn">
      <div class="callout-label">Pozor</div>
      <p style="margin:0">Žiadne protichodné príkazy v jednom stacku (napr. <code>whispered | explosive</code>). A pripomienka: <code>|</code> len v Lyrics, nikdy v Style.</p>

"nikdy si neprišiel"

[End]</div>

  html:`
    <div class="eyebrow">Modul 10 · Prax a Suno</div>
    <h1>Analýza a revízia vlastných textov</h1>
    <p class="lede">Písanie je prepisovanie. Prvá verzia nikdy nie je finálna. Tu sa učíme pozerať na vlastný text kriticky — a premeniť báseň na spievateľný text.</p>

    <h2>Báseň verzus pesničkový text</h2>
    <p>Nie každá dobrá báseň je dobrý pesničkový text. Báseň žije na papieri — môže mať nepravidelný rytmus, dlhé verše, zložitú syntax. Pesničkový text musí <strong>dýchať v čase</strong>, sadnúť do pravidelného metra a dať sa zaspievať. Toto sú najčastejšie úpravy pri premene básne na text:</p>
    <table>
      <tr><th>Báseň často má</th><th>Text potrebuje</th></tr>
      <tr><td>Nepravidelnú dĺžku veršov</td><td>Zhodné dĺžky zodpovedajúcich veršov (±1 slabika)</td></tr>
      <tr><td>Zložité súvetia</td><td>Kratšie celky, miesta na nádych</td></tr>
      <tr><td>Bohatú, hustú obraznosť</td><td>Priestor — nie každý verš plný metafor</td></tr>
      <tr><td>Voľnú štruktúru</td><td>Jasné časti: verš, refrén, bridge</td></tr>
      <tr><td>Jedinečný priebeh</td><td>Opakovateľný refrén</td></tr>
    </table>

    <h2>Kontrolný zoznam revízie</h2>
    <p>Prejdi svoj text bod po bode. Toto je remeselný filter, ktorým prechádzajú aj profesionáli:</p>
    <ul>
      <li>Dá sa každý verš vysloviť na jeden nádych, bez zakoktania?</li>
      <li>Padá rytmický dôraz na prvé slabiky slov? Sú príklonky mimo silných pozícií?</li>
      <li>Majú zodpovedajúce si verše naprieč slohami rovnaký počet slabík (±1)?</li>
      <li>Je v každej slohe aspoň jeden konkrétny zmyslový obraz namiesto abstraktnej deklarácie?</li>
      <li>Nie je tam vata, kalk ani inverzia slovosledu kvôli rýmu?</li>
      <li>Je refrén jednoduchší a údernejší než slohy?</li>
      <li>Prináša bridge skutočný zlom, nie opakovanie?</li>
      <li>Ostalo niečo nepovedané (podtext)?</li>
      <li>Sedia pády, predložkové väzby a kolokácie? Žiadne bohemizmy?</li>
    </ul>

    <div class="callout tip">
      <div class="callout-label">Technika „nahlas a odstup“</div>
      <p style="margin:0">Prečítaj text nahlas — najlepšie na druhý deň, s odstupom. Ucho zachytí, čo oko prehliadne. Miesta, kde sa zakoktáš alebo musíš „nasilu“ prízvukovať, sú miesta na prepis.</p>
    </div>

    <h2>Inverzia — skrytý nepriateľ</h2>
    <p><strong>Inverzia</strong> je prehodenie prirodzeného slovosledu kvôli rýmu alebo metru. „Lásku k tebe cítim veľkú“ — nikto tak nehovorí. Prezrádza, že si sa podriadil forme. Keď ju nájdeš, prepíš celý verš, nech znie ako prirodzená reč.</p>

    <div class="lyric">Inverzia (zle):
„V srdci mojom bôľ sa skrýva“

Prirodzene (dobre):
„V srdci sa mi skrýva bôľ“
alebo lepšie — obraz namiesto deklarácie:
„Nosím to pod rebrami. Ťažké.“</div>

    <h2>Ako veľa prepisovať</h2>
    <p>Nešlifuj do nekonečna. Cieľom nie je „dokonalý“ text, ale text, ktorý <strong>znie a nesie pravdu</strong>. Keď prejde kontrolným zoznamom a znie prirodzene nahlas, je hotový. Zvyšok doladí hudba.</p>
  `,

/* ================= APLIKAČNÁ LOGIKA (jazykovo neutrálna) =================
   Všetky viditeľné reťazce a STORE_KEY prichádzajú z per-jazykového ui.js
   (src/<lang>/ui.js) — tento súbor sa pri jazykových mutáciách NEMENÍ. */
const MODULES = [...MODULES_P1, ...MODULES_P2, ...MODULES_P3];

let state = loadState();
let current = 0;

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { done:{}, quizAnswers:{} };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* počet reálnych modulov (bez welcome) */
function totalModules(){ return MODULES.filter(m=>!m.welcome).length; }
function doneCount(){ return Object.keys(state.done).filter(k=>state.done[k]).length; }

function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  let lastGroup = null;
  MODULES.forEach((m,i)=>{
    if(m.group && m.group !== lastGroup){
      const gl = document.createElement("div");
      gl.className = "nav-group-label";
      gl.textContent = m.group;
      nav.appendChild(gl);
      lastGroup = m.group;
    }
    const item = document.createElement("div");
    item.className = "nav-item" + (i===current ? " active":"");
    const done = state.done[m.id];
    item.innerHTML =
      `<span class="nav-num">${m.num}</span>`+
      `<span>${m.title}</span>`+
      (done ? `<span class="nav-check">✓</span>` : "");
    item.onclick = ()=>{ goTo(i); if(window.innerWidth<=860) toggleMenu(false); };
    nav.appendChild(item);
  });
  // progress
  const dc = doneCount(), tot = totalModules();
  document.getElementById("prog-label").textContent = UI.progress(dc, tot);
  document.getElementById("prog-fill").style.width = (tot? (dc/tot*100):0) + "%";
}

function render(){
  const c = document.getElementById("content");
  const m = MODULES[current];
  let h = `<div class="module active">${m.html}`;

  if(m.quiz){
    h += renderQuiz(m);
  }

  // navigačné tlačidlá dole (okrem welcome a projektu, ktoré majú vlastné)
  if(!m.welcome && !m.project){
    const prev = current>0 ? `<button class="btn secondary" onclick="goTo(${current-1})">${UI.btnPrev}</button>` : "<span></span>";
    const next = current<MODULES.length-1 ? `<button class="btn" onclick="goTo(${current+1})">${UI.btnNext}</button>` : "<span></span>";
    h += `<div class="module-footer">${prev}${next}</div>`;
  }

  h += `</div>`;
  c.innerHTML = h;
  linkifyArtists(c);
  c.scrollTop = 0;
  window.scrollTo(0,0);

  // ak bol kvíz už vyplnený, obnoviť stav
  if(m.quiz && state.quizAnswers[m.id]){
    restoreQuiz(m);
  }
  buildNav();
}

function renderQuiz(m){
  let h = `<div class="quiz" id="quiz-${m.id}">
    <div class="quiz-head">${UI.quizHead}</div>
    <h3>${UI.quizTitle}</h3>
    <p style="font-size:14px;color:var(--ink-soft)">${UI.quizNeed(m.quiz.pass, m.quiz.questions.length)}</p>`;
  m.quiz.questions.forEach((q,qi)=>{
    h += `<div class="q" data-q="${qi}"><div class="q-text">${qi+1}. ${q.q}</div>`;
    q.opts.forEach((opt,oi)=>{
      h += `<label class="q-opt" onclick="selectOpt('${m.id}',${qi},${oi})" data-opt="${oi}">${opt}</label>`;
    });
    h += `</div>`;
  });
  h += `<button class="btn" onclick="submitQuiz('${m.id}')">${UI.quizSubmit}</button>
    <button class="btn secondary" onclick="resetQuiz('${m.id}')" style="margin-left:8px">${UI.quizRetry}</button>
    <div class="quiz-result" id="result-${m.id}"></div>
  </div>`;
  return h;
}

/* Štítky .example-artist zmení na odkazy podľa per-jazykových máp:
   - ARTIST_LINKS (YouTube interpretov): text štítku ZAČÍNA kľúčom
   - LEILA_LINKS (Suno skladby Leily K): text štítku JE názov skladby,
     alebo končí na „— <názov>“ (formát „Leila K — <názov>“)
   Ak mapy chýbajú, štítky ostanú obyčajné — jazyk bez odkazov funguje. */
function linkifyArtists(root){
  const artists = (typeof ARTIST_LINKS !== "undefined") ? ARTIST_LINKS : null;
  const leila = (typeof LEILA_LINKS !== "undefined") ? LEILA_LINKS : null;
  if(!artists && !leila) return;
  root.querySelectorAll("span.example-artist").forEach(el=>{
    const t = el.textContent.trim();
    let href = null, cls = "example-artist", title = "";
    if(artists){
      const k = Object.keys(artists).find(k=>t.startsWith(k));
      if(k){ href = artists[k]; title = (typeof UI!=="undefined" && UI.artistLinkTitle) || ""; }
    }
    if(!href && leila){
      const k = Object.keys(leila).find(k=>t===k || t.endsWith("— "+k));
      if(k){ href = leila[k]; cls += " suno"; title = (typeof UI!=="undefined" && UI.sunoLinkTitle) || ""; }
    }
    if(!href) return;
    const a = document.createElement("a");
    a.className = cls;
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener";
    a.title = title;
    a.innerHTML = el.innerHTML;
    el.replaceWith(a);
  });
}

let picks = {}; // dočasné výbery {qi: oi}

function selectOpt(mid, qi, oi){
  const quiz = document.getElementById("quiz-"+mid);
  if(quiz.classList.contains("locked")) return;
  const q = quiz.querySelector(`.q[data-q="${qi}"]`);
  q.querySelectorAll(".q-opt").forEach(o=>o.classList.remove("selected"));
  q.querySelector(`.q-opt[data-opt="${oi}"]`).classList.add("selected");
  picks[qi] = oi;
}

function submitQuiz(mid){
  const m = MODULES.find(x=>x.id===mid);
  const quiz = document.getElementById("quiz-"+mid);
  const total = m.quiz.questions.length;
  if(Object.keys(picks).length < total){
    const r = document.getElementById("result-"+mid);
    r.className = "quiz-result show fail";
    r.textContent = UI.quizAnswerAll;
    return;
  }
  let correct = 0;
  m.quiz.questions.forEach((q,qi)=>{
    const qEl = quiz.querySelector(`.q[data-q="${qi}"]`);
    qEl.querySelectorAll(".q-opt").forEach(o=>o.classList.add("disabled"));
    const chosen = picks[qi];
    if(chosen === q.correct){
      correct++;
      qEl.querySelector(`.q-opt[data-opt="${chosen}"]`).classList.add("correct");
    }else{
      qEl.querySelector(`.q-opt[data-opt="${chosen}"]`).classList.add("wrong");
      qEl.querySelector(`.q-opt[data-opt="${q.correct}"]`).classList.add("correct");
    }
  });
  quiz.classList.add("locked");
  const passed = correct >= m.quiz.pass;
  const r = document.getElementById("result-"+mid);
  r.className = "quiz-result show " + (passed?"pass":"fail");
  r.innerHTML = passed
    ? UI.quizPass(correct, total, current<MODULES.length-1)
    : UI.quizFail(correct, total, m.quiz.pass);

  // ulož
  state.quizAnswers[mid] = {picks:{...picks}, correct, passed};
  if(passed) state.done[mid] = true;
  saveState();
  buildNav();
}

function restoreQuiz(m){
  const saved = state.quizAnswers[m.id];
  if(!saved) return;
  picks = {...saved.picks};
  const quiz = document.getElementById("quiz-"+m.id);
  // znovu vykresli výsledok
  m.quiz.questions.forEach((q,qi)=>{
    const qEl = quiz.querySelector(`.q[data-q="${qi}"]`);
    const chosen = saved.picks[qi];
    qEl.querySelectorAll(".q-opt").forEach(o=>o.classList.add("disabled"));
    if(chosen === q.correct){
      qEl.querySelector(`.q-opt[data-opt="${chosen}"]`).classList.add("correct");
    }else{
      if(chosen!=null) qEl.querySelector(`.q-opt[data-opt="${chosen}"]`).classList.add("wrong");
      qEl.querySelector(`.q-opt[data-opt="${q.correct}"]`).classList.add("correct");
    }
  });
  quiz.classList.add("locked");
  const r = document.getElementById("result-"+m.id);
  r.className = "quiz-result show " + (saved.passed?"pass":"fail");
  r.innerHTML = saved.passed
    ? UI.quizPassShort(saved.correct, m.quiz.questions.length)
    : UI.quizFailShort(saved.correct, m.quiz.questions.length, m.quiz.pass);
}

function resetQuiz(mid){
  picks = {};
  delete state.quizAnswers[mid];
  delete state.done[mid];
  saveState();
  render();
}

function goTo(i){
  if(i<0 || i>=MODULES.length) return;
  current = i;
  picks = {};
  render();
}

function markProject(){
  state.done["projekt"] = true;
  saveState();
  buildNav();
  const btn = event.target;
  btn.textContent = UI.projectDone;
  btn.disabled = true;
  btn.style.opacity = ".6";
}

function resetProgress(){
  if(confirm(UI.resetConfirm)){
    state = { done:{}, quizAnswers:{} };
    saveState();
    goTo(0);
  }
}

function toggleMenu(force){
  const sb = document.getElementById("sidebar");
  if(force===false){ sb.classList.remove("open"); return; }
  sb.classList.toggle("open");
}

// štart — obnov posledný modul (voliteľné: začni od welcome)
document.addEventListener("DOMContentLoaded", ()=>{
  buildNav();
  render();
});

</script>
